<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="620" fill="url(#abBg)"/>
  <rect width="500" height="620" fill="url(#halo)"/>

  <!-- Geometric accent frame -->
  <rect x="25" y="25" width="450" height="570" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3" rx="16"/>
  <circle cx="25" cy="25" r="4" fill="#f59e0b"/>
  <circle cx="475" cy="25" r="4" fill="#f59e0b"/>
  <circle cx="25" cy="595" r="4" fill="#f59e0b"/>
  <circle cx="475" cy="595" r="4" fill="#f59e0b"/>

  <!-- Portrait Head & Hair -->
  <circle cx="250" cy="210" r="85" fill="#09090b"/>
  <ellipse cx="250" cy="190" rx="95" ry="90" fill="#18181b"/>
  
  <!-- Face -->
  <path d="M 210 200 Q 250 310 290 200 Z" fill="#fed7aa"/>
  
  <!-- Neck & Graceful Stance -->
  <rect x="235" y="275" width="30" height="50" fill="#fdba74" rx="4"/>

  <!-- Face details -->
  <circle cx="250" cy="205" r="4" fill="#b91c1c"/>
  <ellipse cx="225" cy="220" rx="9" ry="5" fill="#3f3f46"/>
  <ellipse cx="275" cy="220" rx="9" ry="5" fill="#3f3f46"/>
  <!-- Smile -->
  <path d="M 235 265 Q 250 282 265 265" stroke="#991b1b" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Professional Executive Jacket / Saree -->
  <path d="M 140 330 L 360 330 L 420 620 L 80 620 Z" fill="url(#blazerGrad)"/>
  
  <!-- Golden Brocade Border / Lapel -->
  <path d="M 250 330 L 210 470 L 250 620" stroke="#f59e0b" stroke-width="12" fill="none"/>
  <path d="M 250 330 L 290 470 L 250 620" stroke="#fbbf24" stroke-width="12" fill="none"/>

  <!-- Gold Star of Excellence -->
  <g transform="translate(250, 470)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 0 -15 L 4 -4 L 15 -4 L 7 3 L 10 14 L 0 7 L -10 14 L -7 3 L -15 -4 L -4 -4 Z" fill="#f59e0b"/>
  </g>

  <!-- Name Plate Overlay at Bottom -->
  <rect x="60" y="525" width="380" height="65" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="250" y="555" font-family="'Mukta', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">योगिता पाटील</text>
  <text x="250" y="578" font-family="'Mukta', sans-serif" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">वक्तृत्व प्रशिक्षक व जीवनशैली मार्गदर्शक</text>
</svg>
