<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#g1)"/>
  <!-- Stage light cones -->
  <polygon points="100,0 20,450 250,450" fill="#f59e0b" opacity="0.12"/>
  <polygon points="500,0 350,450 580,450" fill="#e11d48" opacity="0.1"/>
  <!-- Workshop Banner -->
  <rect x="80" y="40" width="440" height="60" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="75" font-family="'Mukta', sans-serif" font-size="20" font-weight="bold" fill="#fef08a" text-anchor="middle">सांगली ऑफलाइन सघन कार्यशाळा</text>
  <!-- Audience heads rows -->
  <g fill="#475569">
    <circle cx="80" cy="380" r="28"/><circle cx="160" cy="370" r="30"/><circle cx="240" cy="385" r="28"/>
    <circle cx="320" cy="375" r="32"/><circle cx="400" cy="380" r="28"/><circle cx="480" cy="370" r="30"/><circle cx="540" cy="385" r="28"/>
    <circle cx="120" cy="420" r="35"/><circle cx="200" cy="410" r="34"/><circle cx="280" cy="420" r="36"/>
    <circle cx="360" cy="415" r="35"/><circle cx="440" cy="420" r="34"/><circle cx="520" cy="410" r="35"/>
  </g>
  <!-- Instructor on Stage -->
  <circle cx="300" cy="210" r="35" fill="#fbd5b5"/>
  <path d="M 260 250 L 340 250 L 360 340 L 240 340 Z" fill="#b91c1c"/>
  <rect x="270" y="290" width="60" height="60" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <line x1="290" y1="290" x2="300" y2="245" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="300" cy="245" r="5" fill="#f59e0b"/>
  <!-- Tag -->
  <rect x="20" y="20" width="120" height="28" rx="6" fill="#f59e0b"/>
  <text x="80" y="38" font-family="'Mukta', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">सांगली केंद्र</text>
</svg>
