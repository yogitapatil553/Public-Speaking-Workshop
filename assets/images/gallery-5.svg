<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#042f2e"/>
  <!-- Women empowerment batch -->
  <circle cx="300" cy="225" r="160" fill="#134e4a" opacity="0.6"/>
  <!-- Group of smiling women confident speakers -->
  <g>
    <!-- Woman 1 -->
    <circle cx="200" cy="220" r="32" fill="#fed7aa"/>
    <path d="M 160 260 Q 200 320 240 260 Z" fill="#0d9488"/>
    <!-- Woman 2 (Center - Speaker) -->
    <circle cx="300" cy="180" r="36" fill="#fbd5b5"/>
    <path d="M 250 230 Q 300 300 350 230 Z" fill="#f59e0b"/>
    <!-- Woman 3 -->
    <circle cx="400" cy="220" r="32" fill="#fed7aa"/>
    <path d="M 360 260 Q 400 320 440 260 Z" fill="#e11d48"/>
  </g>
  <!-- Mic in hand -->
  <line x1="300" y1="210" x2="300" y2="260" stroke="#fef08a" stroke-width="4"/>
  <circle cx="300" cy="205" r="7" fill="#f59e0b"/>
  <!-- Title Badge -->
  <rect x="150" y="40" width="300" height="42" rx="8" fill="#115e59" stroke="#5eead4" stroke-width="1.5"/>
  <text x="300" y="67" font-family="'Mukta', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">महिला व गृहिणी आत्मविश्वास विशेष बॅच</text>
</svg>
