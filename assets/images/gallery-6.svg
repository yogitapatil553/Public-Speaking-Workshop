<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#1e293b"/>
  <!-- Certificate Graphic -->
  <rect x="120" y="70" width="360" height="260" rx="10" fill="#fefce8" stroke="#f59e0b" stroke-width="6"/>
  <rect x="135" y="85" width="330" height="230" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <text x="300" y="130" font-family="'Mukta', sans-serif" font-size="20" font-weight="800" fill="#92400e" text-anchor="middle">सहभाग व गुणगौरव प्रमाणपत्र</text>
  <text x="300" y="165" font-family="'Mukta', sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">योगिता पाटील भाषणकला कार्यशाळा</text>
  
  <line x1="200" y1="180" x2="400" y2="180" stroke="#f59e0b" stroke-width="2"/>
  
  <text x="300" y="215" font-family="'Mukta', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">प्रमाणित वक्ता (Certified Speaker)</text>
  <text x="300" y="240" font-family="'Mukta', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">“बोला बिनधास्त” वक्तृत्व गौरव</text>
  
  <!-- Golden Seal Stamp -->
  <circle cx="300" cy="280" r="24" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
  <polygon points="300,268 304,277 314,277 306,283 309,292 300,287 291,292 294,283 286,277 296,277" fill="#ffffff"/>

  <!-- Confetti Celebration -->
  <circle cx="80" cy="100" r="6" fill="#f59e0b"/>
  <circle cx="520" cy="120" r="7" fill="#e11d48"/>
  <circle cx="100" cy="280" r="5" fill="#3b82f6"/>
  <circle cx="500" cy="300" r="6" fill="#22c55e"/>
  
  <!-- Banner -->
  <rect x="180" y="360" width="240" height="40" rx="8" fill="#d97706"/>
  <text x="300" y="386" font-family="'Mukta', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">प्रमाणपत्र वितरण व दीक्षांत सोहळा</text>
</svg>
